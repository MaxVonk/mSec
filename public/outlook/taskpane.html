<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhishPilot Reporter</title>
  <!-- Office.js SDK -->
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #ffffff;
      color: #323130;
      font-size: 13px;
      line-height: 1.4;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #18181b; color: #f4f4f5; }
      .header { border-bottom-color: #27272a !important; }
      .email-card { background: #27272a !important; border-color: #3f3f46 !important; }
      #emailFrom { color: #67e8f9 !important; }
      .subtitle { color: #a1a1aa !important; }
      .verdict-desc { color: #e4e4e7 !important; }
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #edebe9;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .logo {
      font-weight: 700;
      font-size: 15px;
      color: #0284c7;
      letter-spacing: -0.2px;
    }
    .subtitle {
      font-size: 11px;
      color: #605e5c;
    }
    .email-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .btn {
      width: 100%;
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 9px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease, transform 0.05s ease;
    }
    .btn:hover { background: #0369a1; }
    .btn:active { background: #075985; transform: scale(0.99); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .verdict-card {
      margin-top: 16px;
      padding: 14px;
      border-radius: 6px;
      border: 1px solid transparent;
      display: none;
    }
    .verdict-phish { background: #fef2f2; border-color: #ef4444; color: #991b1b; }
    .verdict-safe { background: #f0fdf4; border-color: #22c55e; color: #166534; }
    .verdict-sus { background: #fffbeb; border-color: #f59e0b; color: #92400e; }
    .verdict-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .verdict-desc { font-size: 12px; line-height: 1.4; margin-top: 6px; }
    .spinner {
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <img src="/outlook/icon-32.png" alt="PhishPilot" style="width: 28px; height: 28px; border-radius: 4px; object-fit: contain;" />
    <div>
      <div class="logo">PhishPilot</div>
      <div class="subtitle">Security Operations Command</div>
    </div>
  </div>

  <div class="email-card">
    <div style="color: #64748b; font-size: 11px; margin-bottom: 2px;">Subject:</div>
    <div id="emailSubject" style="font-weight: 600; margin-bottom: 8px;">Loading message...</div>
    <div style="color: #64748b; font-size: 11px; margin-bottom: 2px;">Sender:</div>
    <div id="emailFrom" style="font-family: monospace; color: #0284c7; font-size: 11px; word-break: break-all;"></div>
  </div>

  <button id="analyzeBtn" class="btn" onclick="analyzeEmail()">
    <span>Scan &amp; Report Threat</span>
  </button>

  <div id="verdictCard" class="verdict-card">
    <div id="verdictTitle" class="verdict-title"></div>
    <div id="verdictScore" style="font-size: 11px; font-weight: bold; margin-bottom: 6px;"></div>
    <div id="verdictDesc" class="verdict-desc"></div>
  </div>

  <script>
    let currentItem = null;

    Office.onReady((info) => {
      if (info.host === Office.HostType.Outlook) {
        currentItem = Office.context.mailbox.item;
        if (currentItem) {
          const sender = currentItem.from || currentItem.sender;
          document.getElementById('emailSubject').innerText = currentItem.subject || '(No Subject)';
          document.getElementById('emailFrom').innerText = sender?.emailAddress || sender?.displayName || 'Unknown sender';
        }
      } else {
        // Standalone preview fallback
        document.getElementById('emailSubject').innerText = 'Suspicious Account Suspension Notice';
        document.getElementById('emailFrom').innerText = 'admin@it-secure-dept.com';
      }
    });

    async function analyzeEmail() {
      const btn = document.getElementById('analyzeBtn');
      const verdictCard = document.getElementById('verdictCard');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div><span>Forensic Analysis...</span>';
      verdictCard.style.display = 'none';

      try {
        let rawContent = '';
        if (currentItem) {
          let bodyText = '';
          if (currentItem.body && currentItem.body.getAsync) {
            bodyText = await new Promise((resolve) => {
              currentItem.body.getAsync(Office.CoercionType.Text, (res) => resolve(res.value || ''));
            });
          }

          let internetHeaders = '';
          if (typeof currentItem.getAllInternetHeadersAsync === 'function') {
            internetHeaders = await new Promise((resolve) => {
              currentItem.getAllInternetHeadersAsync((res) => {
                if (res && res.status === Office.AsyncResultStatus.Succeeded && res.value) {
                  resolve(res.value);
                } else {
                  resolve('');
                }
              });
            });
          }

          const sender = currentItem.from || currentItem.sender;
          const fromLine = sender ? `From: "${sender.displayName || ''}" <${sender.emailAddress || ''}>` : 'From: Unknown';
          const subjectLine = `Subject: ${currentItem.subject || ''}`;
          const dateLine = `Date: ${currentItem.dateTimeCreated ? currentItem.dateTimeCreated.toISOString() : new Date().toISOString()}`;

          if (internetHeaders) {
            rawContent = internetHeaders + '\r\n\r\n' + bodyText;
          } else {
            rawContent = [fromLine, subjectLine, dateLine, '', bodyText].join('\r\n');
          }
        } else {
          rawContent = 'From: "IT Support" <admin@it-secure-dept.com>\r\nSubject: URGENT: Account Suspension\r\n\r\nPlease verify your credentials immediately.';
        }

        const res = await fetch('/api/phishpilot/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rawEmail: rawContent })
        });

        if (!res.ok) {
          throw new Error('Server returned HTTP ' + res.status);
        }

        const report = await res.json();
        renderVerdict(report);
      } catch (err) {
        alert('PhishPilot analysis failed: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Scan &amp; Report Threat</span>';
      }
    }

    function renderVerdict(report) {
      const card = document.getElementById('verdictCard');
      const title = document.getElementById('verdictTitle');
      const score = document.getElementById('verdictScore');
      const desc = document.getElementById('verdictDesc');

      card.className = 'verdict-card ' + (
        report.verdict === 'PHISHING' ? 'verdict-phish' :
        report.verdict === 'SUSPICIOUS' ? 'verdict-sus' : 'verdict-safe'
      );

      title.innerText = 'Verdict: ' + report.verdict;
      score.innerText = 'Risk Score: ' + report.riskScore + '/100 (' + (report.confidence * 100).toFixed(0) + '% Confidence)';
      desc.innerText = (report.recommendedActions && report.recommendedActions[0]) || 'Analysis complete. Report forwarded to SOC.';
      card.style.display = 'block';
    }
  </script>
</body>
</html>
