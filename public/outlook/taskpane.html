<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhishPilot Reporter</title>
  <!-- Office.js SDK -->
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #ffffff;
      color: #323130;
      font-size: 13px;
      line-height: 1.4;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #201f1e; color: #f3f2f1; }
      .header { border-bottom-color: #3b3a39 !important; }
      .email-card { background: #292827 !important; border-color: #3b3a39 !important; }
      #emailFrom { color: #80c6ff !important; }
      .subtitle { color: #a19f9d !important; }
      .verdict-desc { color: #d2d0ce !important; }
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #edebe9;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .logo {
      font-weight: 600;
      font-size: 15px;
      color: #0078d4;
      letter-spacing: -0.2px;
    }
    .subtitle {
      font-size: 11px;
      color: #605e5c;
    }
    .email-card {
      background: #f3f2f1;
      border: 1px solid #edebe9;
      border-radius: 4px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .btn {
      width: 100%;
      background: #0078d4;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .btn:hover { background: #106ebe; }
    .btn:active { background: #005a9e; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .verdict-card {
      margin-top: 16px;
      padding: 14px;
      border-radius: 4px;
      border: 1px solid transparent;
      display: none;
    }
    .verdict-phish { background: #fde7e9; border-color: #a80000; color: #a80000; }
    .verdict-safe { background: #dff6dd; border-color: #107c10; color: #107c10; }
    .verdict-sus { background: #fff4ce; border-color: #797673; color: #797673; }
    .verdict-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .verdict-desc { font-size: 12px; color: #323130; line-height: 1.4; }
    .spinner {
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <img src="/outlook/shield-icon.png" alt="PhishPilot" style="width: 30px; height: 30px; border-radius: 4px; object-fit: contain;" />
    <div>
      <div class="logo">PhishPilot</div>
      <div class="subtitle">Security Reporter</div>
    </div>
  </div>

  <div class="email-card">
    <div style="color: #605e5c; font-size: 11px; margin-bottom: 2px;">Subject:</div>
    <div id="emailSubject" style="font-weight: 600; margin-bottom: 8px;">Loading message...</div>
    <div style="color: #605e5c; font-size: 11px; margin-bottom: 2px;">Sender:</div>
    <div id="emailFrom" style="font-family: monospace; color: #0078d4; font-size: 11px;"></div>
  </div>

  <button id="analyzeBtn" class="btn" onclick="analyzeEmail()">
    <span>Scan & Report</span>
  </button>

  <div id="verdictCard" class="verdict-card">
    <div id="verdictTitle" class="verdict-title"></div>
    <div id="verdictScore" style="font-size: 11px; font-weight: bold; margin-bottom: 6px;"></div>
    <div id="verdictDesc" class="verdict-desc"></div>
  </div>

  <script>
    let currentItem = null;

    Office.onReady((info) => {
      if (info.host === Office.HostType.Outlook) {
        currentItem = Office.context.mailbox.item;
        if (currentItem) {
          document.getElementById('emailSubject').innerText = currentItem.subject || '(No Subject)';
          document.getElementById('emailFrom').innerText = currentItem.from?.emailAddress || 'Unknown sender';
        }
      } else {
        // Standalone preview fallback
        document.getElementById('emailSubject').innerText = 'Suspicious Account Suspension Notice';
        document.getElementById('emailFrom').innerText = 'admin@it-secure-dept.com';
      }
    });

    async function analyzeEmail() {
      const btn = document.getElementById('analyzeBtn');
      const verdictCard = document.getElementById('verdictCard');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div><span>Analyzing Threat...</span>';
      verdictCard.style.display = 'none';

      try {
        let rawContent = '';
        if (currentItem && currentItem.body) {
          const bodyText = await new Promise((resolve) => {
            currentItem.body.getAsync(Office.CoercionType.Text, (res) => resolve(res.value || ''));
          });
          rawContent = [
            `From: ${currentItem.from?.displayName || ''} <${currentItem.from?.emailAddress || ''}>`,
            `Subject: ${currentItem.subject || ''}`,
            `Date: ${currentItem.dateTimeCreated ? currentItem.dateTimeCreated.toISOString() : new Date().toISOString()}`,
            '',
            bodyText
          ].join('\\n');
        } else {
          rawContent = 'From: "IT Support" <admin@it-secure-dept.com>\\nSubject: URGENT: Account Suspension\\n\\nPlease verify your credentials immediately.';
        }

        const res = await fetch('/api/phishpilot/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rawEmail: rawContent })
        });

        const report = await res.json();
        renderVerdict(report);
      } catch (err) {
        alert('Analysis failed: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Scan & Report Threat</span>';
      }
    }

    function renderVerdict(report) {
      const card = document.getElementById('verdictCard');
      const title = document.getElementById('verdictTitle');
      const score = document.getElementById('verdictScore');
      const desc = document.getElementById('verdictDesc');

      card.className = 'verdict-card ' + (
        report.verdict === 'PHISHING' ? 'verdict-phish' :
        report.verdict === 'SUSPICIOUS' ? 'verdict-sus' : 'verdict-safe'
      );

      title.innerText = 'Verdict: ' + report.verdict;
      score.innerText = 'Risk Score: ' + report.riskScore + '/100 (' + (report.confidence * 100).toFixed(0) + '% Confidence)';
      desc.innerText = report.recommendedActions[0] || 'Investigation complete.';
      card.style.display = 'block';
    }
  </script>
</body>
</html>
