services:
  msec:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msec-hub
    restart: unless-stopped
    ports:
      # Maps port 3310 to allow direct access or local debugging
      - "3310:3310"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3310
      - NODE_ENV=production
      - APP_URL=${APP_URL:-}
      # Security & Environment Modes
      # Set DEMO_MODE=true to enable resetting demo datasets. Set to false in production to prevent data loss.
      - DEMO_MODE=${DEMO_MODE:-false}
      # PhishPilot - Azure OpenAI (optional)
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_DEPLOYMENT_MINI=${AZURE_OPENAI_DEPLOYMENT_MINI:-gpt-4o-mini}
      - AZURE_OPENAI_DEPLOYMENT_FULL=${AZURE_OPENAI_DEPLOYMENT_FULL:-gpt-4o}
      # PhishPilot - Threat Intelligence (optional)
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - ABUSEIPDB_KEY=${ABUSEIPDB_KEY:-}
      - GOOGLE_SAFEBROWSING_KEY=${GOOGLE_SAFEBROWSING_KEY:-}
    volumes:
      # Persistent storage for ingested incidents and connector credentials
      - msec_data:/app/.msec_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3310/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: msec-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./nginx/templates:/etc/nginx/custom-templates:ro
      - ./nginx/entrypoint.sh:/docker-entrypoint.d/40-msec-nginx.sh:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

  certbot:
    image: ${CERTBOT_IMAGE:-certbot/certbot}
    container_name: msec-certbot
    restart: on-failure
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./certbot/creds:/certbot-creds:ro
      - ./certbot/renew.sh:/renew.sh:ro
    entrypoint: ["/bin/sh", "/renew.sh"]

volumes:
  msec_data:
    name: msec_data
    driver: local
