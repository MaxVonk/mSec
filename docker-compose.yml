services:
  msec:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msec-hub
    restart: unless-stopped
    ports:
      # Maps port 3310 on all host interfaces (or override with MSEC_BIND_IP)
      - "${MSEC_BIND_IP:-0.0.0.0}:3310:3310"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3310
      - NODE_ENV=production
      # PhishPilot - Azure OpenAI (optional)
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_DEPLOYMENT_MINI=${AZURE_OPENAI_DEPLOYMENT_MINI:-gpt-4o-mini}
      - AZURE_OPENAI_DEPLOYMENT_FULL=${AZURE_OPENAI_DEPLOYMENT_FULL:-gpt-4o}
      # PhishPilot - Threat Intelligence (optional)
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - ABUSEIPDB_KEY=${ABUSEIPDB_KEY:-}
      - GOOGLE_SAFEBROWSING_KEY=${GOOGLE_SAFEBROWSING_KEY:-}
    volumes:
      # Persistent storage for ingested incidents and connector credentials
      - msec_data:/app/.msec_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3310/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  msec_data:
    name: msec_data
    driver: local

